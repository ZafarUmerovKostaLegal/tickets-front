<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Kosta File — вход</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://res.cdn.office.net/teams-js/2.31.1/js/MicrosoftTeams.min.js"></script>
    <style>
      body { font-family: "Segoe UI", sans-serif; padding: 24px; color: #1f2937; }
      .muted { opacity: 0.7; font-size: 13px; }
    </style>
  </head>
  <body>
    <p id="msg">Завершение входа…</p>
    <p class="muted" id="hint"></p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var payload = {
          type: 'kosta-outlook-oauth',
          code: params.get('code') || '',
          state: params.get('state') || '',
          error: params.get('error_description') || params.get('error') || '',
        };
        var message = JSON.stringify(payload);
        var done = false;

        function mark(text, hint) {
          try { document.getElementById('msg').textContent = text; } catch (e) {}
          if (hint) {
            try { document.getElementById('hint').textContent = hint; } catch (e) {}
          }
        }

        function finish(ok) {
          if (done) return;
          done = true;
          mark(ok ? 'Вход выполнен — возвращаемся…' : 'Ошибка входа', ok ? 'Это окно можно закрыть.' : '');
        }

        // Teams auth popup: notifySuccess WITHOUT app.initialize() — initialize often breaks the dialog.
        function sendTeams() {
          try {
            var auth = window.microsoftTeams && microsoftTeams.authentication;
            if (!auth || typeof auth.notifySuccess !== 'function')
              return false;
            if (payload.error) {
              auth.notifyFailure(String(payload.error));
            } else if (payload.code) {
              // Prefer raw code — some Teams hosts accept plain string; JSON also handled by parent.
              try {
                auth.notifySuccess(message);
              } catch (e1) {
                auth.notifySuccess(payload.code);
              }
            } else {
              auth.notifyFailure('empty_oauth_response');
            }
            finish(!payload.error && !!payload.code);
            return true;
          } catch (e) {
            return false;
          }
        }

        function sendOffice() {
          try {
            if (!(window.Office && Office.context && Office.context.ui && Office.context.ui.messageParent))
              return false;
            Office.context.ui.messageParent(message);
            finish(!payload.error && !!payload.code);
            return true;
          } catch (e) {
            return false;
          }
        }

        function sendOpener() {
          try {
            if (!window.opener)
              return false;
            window.opener.postMessage(payload, window.location.origin);
            finish(!payload.error && !!payload.code);
            try { window.close(); } catch (e) {}
            return true;
          } catch (e) {
            return false;
          }
        }

        function sendAll() {
          if (sendTeams())
            return;
          if (sendOffice())
            return;
          sendOpener();
        }

        sendAll();

        // Late Office bridge (Outlook dialog).
        if (window.Office && Office.onReady) {
          Office.onReady(function () {
            if (!done)
              sendAll();
          });
        }

        // After Teams CDN + host bridge settle.
        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (done || tries > 40) {
            clearInterval(timer);
            if (!done) {
              // Last resort: try initialize then notify (some desktop Teams builds need it).
              try {
                if (window.microsoftTeams && microsoftTeams.app && microsoftTeams.app.initialize) {
                  microsoftTeams.app.initialize().then(function () {
                    if (!done)
                      sendAll();
                  }).catch(function () {});
                }
              } catch (e) {}
              setTimeout(function () {
                if (!done) {
                  mark(
                    'Не удалось вернуть код входа в Teams',
                    'Закройте окно и нажмите «Войти через Microsoft» ещё раз.',
                  );
                }
              }, 800);
            }
            return;
          }
          if (!done)
            sendAll();
        }, 200);
      })();
    </script>
  </body>
</html>
