<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Kosta File — вход</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="https://res.cdn.office.net/teams-js/2.31.1/js/MicrosoftTeams.min.js"></script>
    <style>
      body { font-family: "Segoe UI", sans-serif; padding: 24px; color: #1f2937; }
      .muted { opacity: 0.7; font-size: 13px; }
    </style>
  </head>
  <body>
    <p id="msg">Завершение входа…</p>
    <p class="muted" id="hint"></p>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var payload = {
          type: 'kosta-outlook-oauth',
          code: params.get('code') || '',
          state: params.get('state') || '',
          error: params.get('error_description') || params.get('error') || '',
        };
        var message = JSON.stringify(payload);
        var ok = !payload.error && !!payload.code;
        var done = false;

        function mark(text, hint) {
          try { document.getElementById('msg').textContent = text; } catch (e) {}
          try { document.getElementById('hint').textContent = hint || ''; } catch (e) {}
        }

        function finish() {
          if (done) return false;
          done = true;
          mark(ok ? 'Вход выполнен — возвращаемся…' : 'Ошибка входа', ok ? 'Это окно закроется само.' : payload.error);
          return true;
        }

        function teamsNotify(t) {
          if (done) return;
          if (payload.error)
            t.authentication.notifyFailure(String(payload.error));
          else if (payload.code)
            t.authentication.notifySuccess(message);
          else
            t.authentication.notifyFailure('empty_oauth_response');
          finish();
        }

        function startTeams() {
          var t = window.microsoftTeams;
          if (!t || !t.authentication || !t.app || !t.app.initialize) return;
          try {
            t.app.initialize().then(function () {
              try { teamsNotify(t); } catch (e) {}
            }, function () {});
          } catch (e) {}
        }

        function sendOffice() {
          try {
            if (done || !(window.Office && Office.context && Office.context.ui && Office.context.ui.messageParent))
              return false;
            Office.context.ui.messageParent(message);
            finish();
            return true;
          } catch (e) {
            return false;
          }
        }

        function sameOriginOpener() {
          try {
            return !!window.opener && window.opener.location.origin === window.location.origin;
          } catch (e) {
            return false;
          }
        }

        function sendOpener() {
          if (done || !sameOriginOpener()) return false;
          try {
            window.opener.postMessage(payload, window.location.origin);
            finish();
            try { window.close(); } catch (e) {}
            return true;
          } catch (e) {
            return false;
          }
        }

        startTeams();
        sendOffice();

        if (window.Office && Office.onReady) {
          Office.onReady(function () { sendOffice(); });
        }

        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (done) {
            clearInterval(timer);
            return;
          }
          if (sendOffice()) return;
          if (tries === 15 && sendOpener()) return;
          if (tries >= 60) {
            clearInterval(timer);
            mark('Не удалось вернуть код входа', 'Закройте окно и нажмите «Войти через Microsoft» ещё раз.');
          }
        }, 200);
      })();
    </script>
  </body>
</html>
