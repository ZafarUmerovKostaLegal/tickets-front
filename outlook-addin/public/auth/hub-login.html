<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход Kosta Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f3f6fb;
        background: linear-gradient(165deg, #141c2c, #0b1220);
      }
      p { opacity: 0.85; max-width: 16rem; text-align: center; }
    </style>
  </head>
  <body>
    <p>Подхватываем Microsoft-аккаунт Outlook…</p>
    <script>
      (function () {
        var azure = new URLSearchParams(window.location.search).get('azure');
        if (!azure) {
          document.body.textContent = 'Не задан URL входа Azure';
          return;
        }
        window.location.replace(azure);
      })();
    </script>
  </body>
</html>
