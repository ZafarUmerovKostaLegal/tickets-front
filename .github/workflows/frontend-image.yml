name: Frontend image

on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/zafarumerovkostalegal/tickets-front:latest
          build-args: |
            VITE_API_BASE_URL=https://ticketsback.kostalegal.com
            VITE_USE_SESSION_COOKIE=true
            BUILD_REV=${{ github.sha }}
