version: "3.8"

services:
  tickets-front:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://ticketsback.kostalegal.com}
        VITE_USE_SESSION_COOKIE: ${VITE_USE_SESSION_COOKIE:-true}
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
