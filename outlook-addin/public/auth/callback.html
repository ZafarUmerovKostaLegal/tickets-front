<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kosta File — вход</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f3f6fb;
        background: linear-gradient(165deg, #141c2c, #0b1220);
      }
      main { max-width: 22rem; padding: 24px; text-align: center; }
      #msg { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
      #hint { margin: 0; font-size: 13px; opacity: 0.75; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <p id="msg">Завершение входа…</p>
      <p id="hint"></p>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var payload = {
          type: 'kosta-outlook-oauth',
          code: params.get('code') || '',
          state: params.get('state') || '',
          error: params.get('error_description') || params.get('error') || '',
        };
        var message = JSON.stringify(payload);
        var ok = !payload.error && !!payload.code;
        var done = false;

        function mark(text, hint) {
          try { document.getElementById('msg').textContent = text; } catch (e) {}
          try { document.getElementById('hint').textContent = hint || ''; } catch (e) {}
        }

        function finish(text, hint) {
          if (done) return;
          done = true;
          mark(text || (ok ? 'Вход выполнен' : 'Ошибка входа'), hint || (ok ? 'Возвращаемся в Kosta File…' : payload.error));
        }

        function sendOffice() {
          try {
            if (done || !(window.Office && Office.context && Office.context.ui && Office.context.ui.messageParent))
              return false;
            Office.context.ui.messageParent(message);
            finish();
            return true;
          } catch (e) {
            return false;
          }
        }

        function sameOriginOpener() {
          try {
            return !!window.opener && window.opener.location.origin === window.location.origin;
          } catch (e) {
            return false;
          }
        }

        function sendOpener() {
          if (done || !sameOriginOpener()) return false;
          try {
            window.opener.postMessage(payload, window.location.origin);
            finish();
            try { window.close(); } catch (e) {}
            return true;
          } catch (e) {
            return false;
          }
        }

        try {
          if (window.Office && Office.onReady) Office.onReady(function () { sendOffice(); });
        } catch (e) {}

        var tries = 0;
        var timer = setInterval(function () {
          tries += 1;
          if (done) {
            clearInterval(timer);
            return;
          }
          if (sendOffice()) return;
          if (tries === 15 && sendOpener()) return;
          if (tries >= 60) {
            clearInterval(timer);
            mark('Не удалось вернуть код входа', 'Закройте окно и нажмите «Войти через Microsoft» ещё раз.');
          }
        }, 200);
      })();
    </script>
  </body>
</html>
