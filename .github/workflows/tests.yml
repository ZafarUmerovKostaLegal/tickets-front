name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PW_SHARD_TOTAL: '4'

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Lint
        run: npm run lint:ci

      - name: Check request hygiene
        run: npm run requests:check

      - name: Run Vitest
        run: npm run test:unit:coverage
        env:
          VITEST_MAX_THREADS: '4'

      - name: Check bundle budget
        run: npm run build && npm run build:check-budget

      - name: Upload hidden source maps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-source-maps
          path: dist/assets/*.map
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E shard ${{ matrix.shardIndex }}/${{ env.PW_SHARD_TOTAL }}
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E shard
        run: npx playwright test --shard=${{ matrix.shardIndex }}/4
        env:
          CI: 'true'
          PW_WORKERS: '4'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report/
          retention-days: 7

  e2e-merge:
    name: Merge E2E reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

  smoke:
    name: Smoke E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Smoke tests only
        run: npm run test:e2e:smoke
        env:
          CI: 'true'
          PW_WORKERS: '2'

  e2e-staging:
    name: Real backend smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || vars.STAGING_GATEWAY_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Gateway smoke against staging
        run: npm run test:e2e:real-backend
        env:
          CI: 'true'
          PW_REAL_BACKEND: '1'
          PW_STAGING_URL: ${{ vars.STAGING_GATEWAY_URL || 'http://127.0.0.1:1234' }}
