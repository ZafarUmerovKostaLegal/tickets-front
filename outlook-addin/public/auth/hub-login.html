<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Вход Kosta Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #f3f6fb;
        background: linear-gradient(165deg, #141c2c, #0b1220);
      }
      p { opacity: 0.85; max-width: 18rem; text-align: center; }
    </style>
  </head>
  <body>
    <p>Открываем вход Microsoft…<br/>Не закрывайте окно до завершения.</p>
    <script>
      (function () {
        var KEY = 'kosta.outlook.oauth.authorize';
        var azure = '';
        try {
          azure = localStorage.getItem(KEY) || '';
          localStorage.removeItem(KEY);
        } catch (e) {}
        if (!azure) {
          azure = new URLSearchParams(window.location.search).get('azure') || '';
        }
        if (!azure) {
          document.body.textContent = 'Не найден URL входа Azure. Закройте окно и нажмите «Войти» ещё раз.';
          return;
        }
        window.location.replace(azure);
      })();
    </script>
  </body>
</html>
